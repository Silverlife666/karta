 +list('roles','Role w zespole','Role do wyboru przy pracy zespołowej (np. Podawanie, Pakowanie).',['Rola'],(r,i)=>inp(`roles.${i}`,r))+list('stations','Stanowiska','Maszyny i stanowiska do wyboru na karcie (można też wpisać własne).',['Stanowisko'],(r,i)=>inp(`stations.${i}`,r))+`<div class="row"><button class="pri" id="cfgSave">Zapisz konfigurację</button><button id="cfgReset">Odrzuć zmiany</button></div><p id="cfgErr" class="warn"></p>`}
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
$('cfgBody').oninput=$('cfgBody').onchange=e=>{const el=e.target;if(!ui.cfgDraft)return;const d=el.dataset;
 if(d.pr){const[r,k]=d.pr.split('|'),a=ui.cfgDraft.perms.roles[r]||(ui.cfgDraft.perms.roles[r]=[]);ui.cfgDraft.perms.roles[r]=el.checked?[...new Set([...a,k])]:a.filter(x=>x!==k);return}
 if(d.pu){const[id,k]=d.pu.split('|'),a=ui.cfgDraft.perms.users[id]||[];ui.cfgDraft.perms.users[id]=el.checked?[...new Set([...a,k])]:a.filter(x=>x!==k);return}
 if(d.pa){if(el.value)ui.cfgDraft.perms.assign[d.pa]=el.value;else delete ui.cfgDraft.perms.assign[d.pa];renderConfig();return}
 if(d.pm){const u=state.users.find(x=>x.id===d.pm);if(el.value==='own'){const er=u?effRole(ui.cfgDraft,u):'operator';ui.cfgDraft.perms.users[d.pm]=[...(ui.cfgDraft.perms.roles[er]||KP[er]||KP.operator)]}else delete ui.cfgDraft.perms.users[d.pm];renderConfig();return}
 if(!d.p)return;setPath(ui.cfgDraft,el.dataset.p,el.type==='checkbox'?el.checked:el.value)};
$('cfgBody').onclick=e=>{const b=e.target.closest('button');if(!b||!ui.cfgDraft)return;
 if(b.dataset.add){ui.cfgDraft[b.dataset.add].push(NEW_ROW[b.dataset.add]());renderConfig()}
 else if(b.dataset.del){const[k,i]=b.dataset.del.split('.');ui.cfgDraft[k].splice(+i,1);renderConfig()}
 else if(b.id==='cfgReset'){ui.cfgDraft=null;renderConfig()}
 else if(b.id==='cfgSave'){const c=ui.cfgDraft,err=m=>{$('cfgErr').textContent=m};
  c.units=c.units.filter(u=>String(u.name).trim());c.types=c.types.filter(t=>String(t.name).trim());c.shifts=c.shifts.filter(s=>String(s.name).trim());c.reasons=c.reasons.map(String).filter(r=>r.trim());c.downReasons=(c.downReasons||[]).map(String).filter(r=>r.trim());c.roles=(c.roles||[]).map(String).filter(r=>r.trim());c.stations=(c.stations||[]).map(String).filter(r=>r.trim());
  if(!c.units.length||!c.types.length||!c.shifts.length)return err('Potrzebna jest co najmniej jedna zmiana, jednostka i typ pracy.');
  if(new Set(c.units.map(u=>u.name)).size!==c.units.length||new Set(c.types.map(t=>t.name)).size!==c.types.length)return err('Nazwy jednostek i typów pracy muszą być unikalne.');
  c.types.forEach(t=>{if(!c.units.some(u=>u.name===t.unit))t.unit=c.units[0].name});c.idleMin=+c.idleMin||0;
  if(!c.shifts.some(s=>String(s.id)===String(c.defaultShift)))c.defaultShift=c.shifts[0].id;
  const newCfg={...def,...c},cl=diffCfg(state.cfg,newCfg,state.users);if(cl.length)logAdd('cfg','Zapisano konfigurację',cl);state.cfg=newCfg;state.cfgUpdated=Date.now();ui.cfgDraft=null;save();renderConfig();$('cfgErr').textContent='';setSync('Konfiguracja zapisana')}};

/* ===== start ===== */
try{const v=localStorage.getItem('karta-cal-view');if(['day','week','month'].includes(v))ui.cal.view=v}catch(e){}
loadLocal();render();
syncUsers(true).then(()=>pull());
setInterval(()=>{if(document.visibilityState==='visible'&&!ui.editing)pull()},45000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!ui.editing)pull()});
</script>
<script>
/* ===== Pływający panel nawigacji MES (ten sam w Etapach 1–3) ===== */
(function(){
 const CUR='karta',KEY='mesNavUrls',OPEN='mesNavOpen',
 ST=[{id:'bobbin',n:1,name:'Rolsiarka',ico:'🌀',def:'https://silverlife666.github.io/Bobina/'},{id:'pakowanie',n:2,name:'Pakowanie',ico:'📦',def:'https://silverlife666.github.io/pakowanie/'},{id:'klejenie',n:3,name:'Klejenie',ico:'🧴',def:'https://silverlife666.github.io/klejenie/'},{id:'hala',n:0,name:'Hala (przegląd zleceń)',ico:'🏭',def:'https://silverlife666.github.io/hala/'},{id:'karta',n:0,name:'Karta pracy',ico:'🗒️',def:'https://silverlife666.github.io/karta/'}],
 esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let U={};try{U=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
 let open=(()=>{try{const v=localStorage.getItem(OPEN);return v===null?innerWidth>900:v==='1'}catch(e){return true}})();
 const css=document.createElement('style');
 css.textContent=`#mesNav{position:fixed;left:12px;bottom:12px;z-index:50;font:13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2d3d}
#mesNav .box{background:#fff;border:1px solid #c9d6e2;border-radius:12px;box-shadow:0 6px 20px #0003;overflow:hidden;min-width:200px}
#mesNav .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#25476a;color:#fff;padding:8px 10px;font-weight:700;cursor:pointer;user-select:none}
#mesNav .hd span{opacity:.8;font-weight:400}
#mesNav a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #eef2f6;color:inherit;text-decoration:none}

#mesNav a b{margin-left:auto;font-weight:400;font-size:11px;color:#2e7d32}
#mesNav .ft{border-top:1px solid #eef2f6;padding:6px 12px;font-size:11px}
#mesNav .ft button{background:none;border:0;padding:0;color:#4a6d8c;cursor:pointer;font:inherit;text-decoration:underline}
#mesNav .fab{width:46px;height:46px;border-radius:50%;border:0;background:#25476a;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 20px #0004}
@media print{#mesNav{display:none}}`;
 document.head.appendChild(css);
 const root=document.createElement('div');root.id='mesNav';document.body.appendChild(root);
 const url=s=>(U[s.id]||'').trim()||s.def,
 setOpen=v=>{open=v;try{localStorage.setItem(OPEN,v?'1':'0')}catch(e){}draw()};
 function settings(){const n={};for(const s of ST){const v=prompt('Adres '+(s.n?'Etapu '+s.n+' – ':'')+s.name+'\n(pusty = domyślny: '+s.def+')',U[s.id]||s.def);if(v===null)return;n[s.id]=v.trim()===s.def?'':v.trim()}U=n;try{localStorage.setItem(KEY,JSON.stringify(U))}catch(e){}draw()}
 function draw(){
  if(!open){root.innerHTML='<button class="fab" title="Nawigacja MES" aria-label="Nawigacja MES">🧭</button>';root.querySelector('.fab').onclick=()=>setOpen(true);return}
  root.innerHTML='<div class="box"><div class="hd" title="Zwiń">🧭 Nawigacja MES <span>▾</span></div>'+
   ST.map(s=>s.id===CUR?`<a class="cur" href="#" tabindex="-1">${s.ico} ${s.n?'Etap '+s.n+' · ':''}${esc(s.name)}<b>● tu</b></a>`:`<a href="${esc(url(s))}">${s.ico} ${s.n?'Etap '+s.n+' · ':''}${esc(s.name)}</a>`).join('')+
   '<div class="ft"><button type="button" id="mesNavCfg">⚙ Ustaw adresy</button></div></div>';
  root.querySelector('.hd').onclick=()=>setOpen(false);root.querySelector('#mesNavCfg').onclick=settings}
 draw();
})();
